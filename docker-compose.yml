services:
  postgres:
    image: postgres:16-alpine
    container_name: stoveguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stoveguard
      POSTGRES_PASSWORD: stoveguard_dev
      POSTGRES_DB: stoveguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoveguard -d stoveguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: stoveguard-postgres-data
